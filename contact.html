---
layout: default
title: Contact
---
<table>
    <tr>
        <td style="text-align: justify;">
            Please email all inquiries to <a href="mailto:reu@cs.odu.edu">reu AT cs DOT odu DOT edu </a>
        </td>
    </tr>
</table>
{% for contact in site.data.contact %}
<table>
    <tr>
        <td style="text-align: justify;">
            <div style="font-size: 1em;">{{ contact.name }}</div>
            {% for t in contact.titles %}<div style="font-size: 1em;">{{ t }}</div>{% endfor %}
            <a href="mailto:{{ contact.email }}">{{ contact.email }}</a>
        </td>
    </tr>
</table>
{% endfor %}
