description_1: >-
  This Research Experiences for Undergraduates Site project will engage motivated students in the rapidly growing research area of human-AI interaction and evaluation. With its focus on how humans and AI work together, this program will broaden the views of the students, providing them with a holistic and in-depth understanding of human-AI interaction and its growing impact across the Web. They will leverage knowledge and skills learned to understand and evaluate AI systems, which could aid their families, friends, and social media contacts and eventually help prevent AI from harming humans. Their knowledge and skills will not only prepare students for AI-related jobs in research or industry, it will encourage them to pursue graduate study and research in general. This program will also contribute to the development of a diverse, globally competitive workforce by providing research and education opportunities to an economically diverse group of students, including female, underrepresented minorities, first-generation college students, and those from undergraduate institutions who may not have previous exposure to research or graduate school.

description_2: >-
  The goal of this REU Site is to engage participating students in real-world projects studying human-AI interaction from the perspectives of data analytics, information retrieval, applied machine learning, human-computer interaction, and social computing. Students participating in the REU Site project will learn:


objective_list:
  - objective: The concept of human-AI interaction, its methods, interfaces, and active research topics,
  - objective: Mainstream computational methods to study human-AI interaction, including how to access, clean, preprocess, and visualize data and how to build analytical and predictive models using open source programming tools,
  - objective: Important metrics to evaluate research results, compare baseline models, and produce preliminary results for publication quality research products, and
  - objective: Essential research skills including brainstorming discussion, programming experiments, evaluation, trial-and-error, technical writing, and research presentation.

goal: >-
  Students will conduct hands-on research on topics of their own choosing that fit within faculty members' existing broad human-AI interaction research programs. The participants will learn essential knowledge and skills to support future careers, whether research or application oriented.
